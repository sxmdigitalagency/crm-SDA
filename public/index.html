<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SDA · CRM</title>
  <meta name="theme-color" content="#e9f0ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#061318" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Appliqué avant le rendu pour éviter un flash du mauvais thème.
    try { const t = localStorage.getItem('sda-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/views.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <div class="backdrop" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="shell">
    <aside class="sidebar glass-float" aria-label="Navigation principale">
      <a class="brand" href="/" data-link>
        <span class="brand-mark" aria-hidden="true">SDA</span>
        <span translate="no"><strong>SDA</strong><small>Digital Agency</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="nav-foot">
        <div class="theme-switch" role="group" aria-label="Thème" id="theme-switch"></div>
        <button class="btn ghost" id="logout" hidden><span class="logout-icon"></span><span class="logout-label">Se déconnecter</span></button>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1"><div class="page" id="view"></div></main>
  </div>
</body>
</html>
