<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hash du mot de passe · CRM SDA</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 560px; margin: 48px auto; padding: 0 16px; line-height: 1.5; }
    label { display: block; font-weight: 600; margin-top: 16px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font: inherit; border-radius: 8px; border: 1px solid #8a9; margin-top: 6px; }
    textarea { font-family: ui-monospace, monospace; font-size: 13px; height: 90px; }
    button { margin-top: 16px; padding: 10px 16px; font: inherit; font-weight: 600; border-radius: 8px; border: 0; background: #00757f; color: #fff; cursor: pointer; }
    .note { font-size: 14px; color: #5a6f75; }
    .err { color: #b8302f; }
  </style>
</head>
<body>
  <h1>Hash du mot de passe</h1>
  <p class="note">Ouvrez ce fichier directement depuis votre ordinateur. Le calcul se fait dans votre navigateur :
    le mot de passe n'est envoyé nulle part. Copiez ensuite le résultat dans le secret
    <code>ADMIN_PASSWORD_HASH</code> de Cloudflare Pages.</p>
  <form id="f">
    <label>Mot de passe (12 caractères minimum)<input id="p" type="password" autocomplete="new-password" required minlength="12"></label>
    <label>Confirmation<input id="c" type="password" autocomplete="new-password" required></label>
    <button>Générer le hash</button>
    <p id="e" class="err" role="alert"></p>
    <label>Résultat<textarea id="o" readonly></textarea></label>
  </form>
  <script>
    // Même format que functions/lib/auth.ts : pbkdf2$<itérations>$<sel b64>$<hash b64>
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const p = document.getElementById('p').value, c = document.getElementById('c').value;
      const e = document.getElementById('e'), o = document.getElementById('o');
      e.textContent = ''; o.value = '';
      if (p.length < 12) return (e.textContent = 'Au moins 12 caractères.');
      if (p !== c) return (e.textContent = 'Les deux saisies ne correspondent pas.');
      const iterations = 100000;
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, key, 256);
      const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
      o.value = `pbkdf2$${iterations}$${b64(salt)}$${b64(bits)}`;
      o.select();
    });
  </script>
</body>
</html>
